name: Pull contacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, leave the sheet unchanged
        type: boolean
        default: true
  # Enable once manual runs look right. Mondays 13:00 UTC.
  # schedule:
  #   - cron: "0 13 * * 1"

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pull_contacts.py
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          MAX_ENRICH_PER_RUN: ${{ vars.MAX_ENRICH_PER_RUN }}
