name: Send emails

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, send nothing
        type: boolean
        default: true
  # Enable once manual runs look right. 14:00 UTC is 10am ET, weekdays.
  # schedule:
  #   - cron: "0 14 * * 1-5"

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python send_emails.py
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          DAILY_NEW_LIMIT: ${{ vars.DAILY_NEW_LIMIT }}
